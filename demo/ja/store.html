<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>店舗の詳細 — 表をCSVに保存</title>
<meta name="robots" content="noindex">
<link rel="icon" href="../../favicon.png">
<style>
  :root { --bg:#fff; --fg:#16181d; --muted:#5b6470; --line:#dfe3e8; --card:#f7f8fa; --accent:#127a52; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#17181b; --fg:#e8e8ea; --muted:#9aa0a6; --line:#31343a; --card:#1e2024; --accent:#3fbb89; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
         font:15px/1.7 "Segoe UI","Hiragino Sans","Yu Gothic UI",system-ui,sans-serif; }
  .wrap { max-width: 880px; margin: 0 auto; padding: 28px 20px 64px; }
  a { color: var(--accent); }
  .nav { font-size:.88rem; margin: 0 0 24px; color: var(--muted); }
  h1 { font-size:1.6rem; margin:0 0 6px; letter-spacing:-.02em; }
  .intro { color:var(--muted); margin:0 0 32px; }
  h2 { font-size:1.05rem; margin:34px 0 4px; }
  .note { color:var(--muted); font-size:.87rem; margin:0 0 12px; }

  table.data { border-collapse: collapse; width:100%; font-size:.92rem; }
  table.data th, table.data td { border:1px solid var(--line); padding:7px 11px; text-align:left; }
  table.data thead th { background:var(--card); font-weight:600; white-space:nowrap; }
  table.data td.num { text-align:right; font-variant-numeric: tabular-nums; }
  table.data .down { color:#b91c1c; }
  @media (prefers-color-scheme: dark) { table.data .down { color:#f87171; } }

  .grid { border:1px solid var(--line); border-radius:8px; overflow:hidden; font-size:.92rem; }
  .grid [role="row"] { display:grid; grid-template-columns: 1.2fr 1.2fr 1fr .7fr; }
  .grid [role="row"] + [role="row"] { border-top:1px solid var(--line); }
  .grid [role="columnheader"] { background:var(--card); font-weight:600; }
  .grid [role="columnheader"], .grid [role="gridcell"] { padding:7px 11px; }

  table.layout { width:100%; border-collapse:collapse; margin-top:6px; }
  table.layout td { padding:14px 16px; background:var(--card); border:1px solid var(--line); border-radius:8px; }
  table.layout td strong { display:block; margin-bottom:2px; }

  .pager { display:flex; align-items:center; gap:14px; margin-top:30px;
           border-top:1px solid var(--line); padding-top:16px; font-size:.92rem; }
  .pager .spacer { flex:1; }
  .pager .muted { color:var(--muted); }
  .pagenote { color:var(--muted); font-size:.87rem; margin:8px 0 0; }
</style>
</head>
<body>
<div class="wrap">
<p class="nav"><a href="./">← 店舗別 売上</a></p>
<h1 id="name">店舗</h1>
<p class="intro">小さな表を1つ置いてあります。「リンク先ページの表も取得」で拾えます。</p>
<table class="data">
  <thead><tr><th>項目</th><th>値</th></tr></thead>
  <tbody>
    <tr><td>開店日</td><td>2019-04-01</td></tr>
    <tr><td>売場面積 (m2)</td><td class="num">248</td></tr>
    <tr><td>従業員数</td><td class="num">17</td></tr>
  </tbody>
</table>
<script>
  // 一覧から渡された番号を見出しに出すだけの、行き止まりにしないためのページ
  const id = new URLSearchParams(location.search).get('id');
  if (id) document.getElementById('name').textContent += ' #' + id;
</script>
</div>
</body>
</html>
