<style>
  /* 見出しの英字だけに使う。日本語は各OSの標準フォント */
  @font-face {
    font-family: "Anton"; src: url(fonts/anton-latin-400.woff2) format("woff2");
    font-display: swap;
  }
  @font-face {
    font-family: "JetBrains Mono"; src: url(fonts/jetbrains-mono-latin-400.woff2) format("woff2");
    font-display: swap;
  }

  :root {
    --bg: #000; --panel: #1e1e23; --fg: #f2f2f3; --muted: #9c9ca6; --line: #2b2b32;
    --accent: #3fbb89; --accent-fg: #03140c;
    --side: 236px;
    --sans: "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Noto Sans JP", "Yu Gothic UI", Meiryo, system-ui, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
    --display: "Anton", "Arial Narrow", Impact, sans-serif;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 15px/1.95 var(--sans); letter-spacing: .03em;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; }
  ::selection { background: var(--accent); color: var(--accent-fg); }
  .mono { font-family: var(--mono); letter-spacing: .08em; }

  /* ---------- 左の固定ナビ ---------- */
  .side {
    position: fixed; inset: 0 auto 0 0; width: var(--side); z-index: 10;
    display: flex; flex-direction: column; padding: 28px 24px 24px;
    border-right: 1px solid var(--line); background: var(--bg);
  }
  .brand { display: flex; align-items: center; gap: 12px; text-decoration: none; }
  .brand .mark { flex: none; width: 34px; height: 34px; background: var(--accent); display: grid; place-items: center; }
  .brand .mark svg { width: 22px; height: 22px; }
  .brand b { font-size: 13px; line-height: 1.45; letter-spacing: .06em; word-break: keep-all; overflow-wrap: anywhere; }
  .side nav { margin-top: 52px; }
  .side nav a {
    display: flex; align-items: baseline; gap: 14px; padding: 11px 0 9px;
    border-top: 1px solid var(--line); text-decoration: none;
    font: 23px/1.1 var(--display); letter-spacing: .05em; text-transform: uppercase;
    transition: color .15s, padding-left .15s;
  }
  .side nav a:last-child { border-bottom: 1px solid var(--line); }
  .side nav a i { font: normal 10.5px/1 var(--mono); letter-spacing: .1em; color: var(--accent); }
  .side nav a:hover { color: var(--accent); padding-left: 6px; }
  .side-foot { margin-top: auto; font: 10.5px/1.9 var(--mono); letter-spacing: .08em; color: var(--muted); }
  #lang {
    display: block; width: 100%; margin-bottom: 14px; padding: 7px 8px;
    font: 12px var(--sans); color: var(--fg); background: var(--bg);
    border: 1px solid var(--line); border-radius: 0;
  }

  main { margin-left: var(--side); }
  .in { max-width: 1120px; padding: 0 clamp(20px, 5vw, 64px); }

  /* ---------- 冒頭 ---------- */
  .hero { position: relative; overflow: hidden; border-bottom: 1px solid var(--line); }
  .hero .in {
    position: relative; min-height: 100vh; padding-top: 72px; padding-bottom: 72px;
    display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, .9fr); gap: clamp(32px, 5vw, 72px); align-items: center;
  }
  .hero .ghost-word {
    position: absolute; right: -.04em; bottom: -.2em; margin: 0; pointer-events: none;
    font: 30vw/1 var(--display); letter-spacing: -.01em; color: transparent;
    -webkit-text-stroke: 1px #2c2c34;
  }
  .kicker { margin: 0 0 28px; font-size: 11px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 6px 18px; }
  .kicker span:first-child { color: var(--accent); }
  h1 {
    margin: 0; font-size: clamp(2.4rem, 4.6vw, 4rem); line-height: 1.15; font-weight: 800; letter-spacing: .02em;
    word-break: keep-all; overflow-wrap: anywhere; text-wrap: balance;
  }
  .tagline { margin: 18px 0 0; font-size: clamp(1.05rem, 1.9vw, 1.35rem); font-weight: 700; line-height: 1.6; }
  .lead { margin: 18px 0 0; color: var(--muted); max-width: 34em; }
  .cta { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 36px; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 10px;
    padding: 14px 22px; min-height: 50px; font-weight: 700; font-size: 14px; text-decoration: none;
    border: 1px solid var(--fg); transition: background .15s, color .15s, border-color .15s;
  }
  .btn-primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
  .btn-primary:hover { background: var(--fg); border-color: var(--fg); }
  .btn-ghost { color: var(--fg); }
  .btn-ghost:hover { background: var(--fg); color: var(--bg); }
  .btn-soon { border-color: var(--line); color: var(--muted); cursor: default; }

  .spec { margin: 40px 0 0; border-top: 1px solid var(--line); max-width: 34em; }
  .spec div { display: grid; grid-template-columns: 9.5em 1fr; gap: 16px; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
  .spec dt { color: var(--muted); }
  .spec dd { margin: 0; }

  .shot { margin: 0; justify-self: end; width: 100%; max-width: 440px; }
  .shot img { display: block; width: 100%; height: auto; border: 1px solid var(--line); background: var(--panel); }
  .shot figcaption { margin-top: 12px; font-size: 10.5px; line-height: 1.7; color: var(--muted); }
  .shot figcaption b { color: var(--fg); font-weight: 400; margin-right: 10px; }

  /* ---------- 各セクション ---------- */
  .sec { border-bottom: 1px solid var(--line); padding: 104px 0 112px; }
  .sec-head { display: grid; grid-template-columns: auto 1fr; align-items: end; column-gap: 20px; margin-bottom: 44px; }
  .sec-head .num { font-size: 11px; color: var(--accent); padding-bottom: 14px; }
  .sec-head .big { grid-column: 2; margin: 0; font: clamp(3.6rem, 9vw, 7.5rem)/.9 var(--display); letter-spacing: .01em; text-transform: uppercase; }
  .sec-head h2 { grid-column: 2; margin: 14px 0 0; font-size: 15px; font-weight: 700; color: var(--muted); letter-spacing: .12em; }
  .sec-lead { margin: 0 0 40px; max-width: 40em; }

  .feats { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
  .feats li {
    display: grid; grid-template-columns: 64px minmax(0, 15em) minmax(0, 1fr); gap: 8px 28px;
    padding: 28px 0; border-bottom: 1px solid var(--line);
  }
  .feats .n { font-size: 11px; color: var(--accent); padding-top: 5px; }
  .feats h3 { margin: 0; font-size: 17px; line-height: 1.6; }
  .feats p { margin: 0; color: var(--muted); }

  .plans { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); border: 1px solid var(--line); }
  .plan { display: flex; flex-direction: column; padding: 32px clamp(20px, 3vw, 36px) 36px; }
  .plan + .plan { border-left: 1px solid var(--line); }
  .plan.featured { background: var(--panel); }
  .plan h3 { margin: 0; font: 12px/1 var(--mono); letter-spacing: .12em; color: var(--muted); }
  .plan.featured h3 { color: var(--accent); }
  .price { margin: 20px 0 0; font: 64px/1 var(--display); letter-spacing: .01em; }
  .price small { margin-left: 12px; font: 700 13px var(--sans); letter-spacing: .06em; color: var(--muted); vertical-align: middle; }
  .plan ul { list-style: none; margin: 28px 0 32px; padding: 0; border-top: 1px solid var(--line); }
  .plan li { padding: 10px 0 10px 22px; border-bottom: 1px solid var(--line); position: relative; font-size: 14px; }
  .plan li::before { content: ""; position: absolute; left: 2px; top: calc(10px + .975em); width: 8px; height: 1px; background: var(--accent); }
  .plan .btn { margin-top: auto; width: 100%; }

  .faq { margin: 0; border-top: 1px solid var(--line); counter-reset: q; }
  .faq div { display: grid; grid-template-columns: 64px minmax(0, 1fr); column-gap: 28px; padding: 26px 0; border-bottom: 1px solid var(--line); counter-increment: q; }
  .faq div::before { content: "Q" counter(q, decimal-leading-zero); grid-row: span 2; font: 11px/2.4 var(--mono); letter-spacing: .1em; color: var(--accent); }
  .faq dt { font-weight: 700; font-size: 16px; }
  .faq dd { margin: 8px 0 0; color: var(--muted); }

  footer { padding: 56px 0 64px; font-size: 13px; color: var(--muted); }
  footer .in { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 18px 40px; }
  footer nav { display: flex; gap: 24px; }
  footer nav a { text-decoration: none; border-bottom: 1px solid var(--line); }
  footer nav a:hover { color: var(--fg); border-color: var(--fg); }
  footer p { margin: 0; }

  /* ---------- 幅の狭い画面 ---------- */
  @media (max-width: 960px) {
    .side {
      position: sticky; top: 0; inset: auto; width: auto; flex-direction: row; flex-wrap: wrap;
      align-items: center; gap: 10px 16px; padding: 12px 20px; border-right: 0; border-bottom: 1px solid var(--line);
    }
    .side nav { order: 3; flex-basis: 100%; margin: 0; display: flex; gap: 18px; overflow-x: auto; }
    .side nav a, .side nav a:last-child { border: 0; padding: 2px 0; font-size: 17px; gap: 6px; }
    .side nav a:hover { padding-left: 0; }
    .side-foot { margin: 0 0 0 auto; }
    .side-foot span { display: none; }
    #lang { margin: 0; width: auto; }
    main { margin-left: 0; }
    .hero .in { grid-template-columns: 1fr; min-height: 0; padding-top: 48px; padding-bottom: 64px; }
    .shot { justify-self: start; max-width: 400px; }
    .hero .ghost-word { font-size: 52vw; }
    .sec { padding: 72px 0 80px; }
    .feats li { grid-template-columns: 1fr; gap: 6px; }
    .plans { grid-template-columns: 1fr; }
    .plan + .plan { border-left: 0; border-top: 1px solid var(--line); }
    .faq div { grid-template-columns: 1fr; }
    .faq div::before { grid-row: auto; }
  }
  @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
</style>
</head>

<script>
  // 画面写真は日本語版と英語版の2枚。表示言語が変わったら差し替える
  (() => {
    const img = document.getElementById('shot');
    const sync = () => {
      const ja = document.documentElement.lang === 'ja';
      img.src = ja ? 'img/popup-ja.webp' : 'img/popup-en.webp';
      img.alt = document.querySelector('[data-i18n="figCap"]').textContent;
    };
    new MutationObserver(sync).observe(document.documentElement, { attributes: true, attributeFilter: ['lang'] });
    sync();
  })();
</script>
